<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Ads Simulator Pro</title>
<style>
:root{--blue:#1a73e8;--blue2:#0b57d0;--ink:#202124;--muted:#5f6368;--line:#dadce0;--bg:#f1f3f4;--green:#188038;--red:#d93025;--amber:#e37400;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Arial,Roboto,sans-serif}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:24px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-size:22px;color:#5f6368;min-width:205px}.gmark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 30deg,#4285f4 0 28%,#34a853 28% 48%,#fbbc04 48% 68%,#ea4335 68% 83%,#4285f4 83%);clip-path:polygon(50% 0,100% 100%,0 100%)}.search{height:40px;background:#f1f3f4;border-radius:8px;max-width:520px;flex:1;display:flex;align-items:center;padding:0 14px;color:#5f6368}.topright{margin-left:auto;color:#5f6368;display:flex;gap:22px;align-items:center}.avatar{background:#e8710a;color:white;border-radius:50%;width:32px;height:32px;display:grid;place-items:center}.layout{display:grid;grid-template-columns:238px minmax(0,1fr)}aside{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:18px 12px;position:sticky;top:58px;height:calc(100vh - 58px)}.navtitle{padding:12px 14px;color:#5f6368;font-weight:600}.nav{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:0 24px 24px 0;color:#3c4043;cursor:pointer;margin:3px 0}.nav:hover,.nav.active{background:#e8f0fe;color:var(--blue);font-weight:600}.nav .ico{width:18px;text-align:center;font-size:17px}.sidefoot{position:absolute;bottom:18px;left:24px;color:#5f6368;font-size:12px}.main{padding:26px 34px 70px;max-width:1500px;width:100%;margin:auto}.crumb{color:#5f6368;margin-bottom:8px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.heading h1{font-size:26px;font-weight:400;margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--blue);padding:10px 18px;border-radius:4px;font-weight:600;cursor:pointer}.btn:hover{background:#f6fafe}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:var(--blue2)}.btn.text{border:0;background:transparent}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:14px 0;box-shadow:0 1px 2px #0000000d}.cardhead{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}.cardbody{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{border:1px solid var(--line);border-radius:4px;padding:18px;min-height:120px;cursor:pointer;background:white}.tile:hover{border-color:var(--blue)}.tile.selected{border:2px solid var(--blue);padding:17px;background:#f8fbff}.tile b{display:block;margin:8px 0 5px;font-size:15px}.tile p{margin:0;color:var(--muted)}.tile .symbol{font-size:20px;color:var(--blue)}label{display:block;font-weight:500;margin:14px 0 6px}input,select,textarea{font:14px Arial;width:100%;border:1px solid #9aa0a6;border-radius:4px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border:2px solid var(--blue);padding:10px 11px}textarea{min-height:78px;resize:vertical}.field{max-width:680px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.radio{display:flex;align-items:center;gap:9px;margin:10px 0;color:#3c4043}.radio input{width:auto}.stepper{display:flex;gap:0;margin:18px 0 24px;overflow:auto}.step{padding:11px 14px;border-bottom:3px solid #dadce0;color:#5f6368;white-space:nowrap;cursor:pointer}.step.active{border-color:var(--blue);color:var(--blue);font-weight:600}.step.done{color:var(--green);border-color:var(--green)}.actions{display:flex;justify-content:space-between;margin-top:24px}.alert{background:#e8f0fe;border-radius:6px;padding:13px 16px;color:#3c4043;margin:12px 0}.tag{display:inline-block;background:#e8f0fe;color:#174ea6;border-radius:14px;padding:4px 10px;font-size:12px;margin:3px}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;font-weight:400;margin-top:8px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #e8eaed}th{color:#5f6368;font-weight:600;background:#fafafa}tr:last-child td{border:0}.status{color:var(--green);font-weight:600}.status.paused{color:var(--amber)}.pill{border-radius:4px;background:#e6f4ea;color:#137333;padding:4px 8px;font-size:12px}.preview{border:1px solid var(--line);border-radius:8px;padding:18px;max-width:420px}.preview .url{color:var(--green);font-size:12px}.preview h3{color:#1a0dab;font-size:18px;font-weight:400;margin:6px 0}.muted{color:var(--muted)}.hidden{display:none!important}.subnav{font-size:12px;color:var(--muted);padding:8px 14px 8px 46px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#e8f0fe;color:#174ea6;padding:5px 9px;border-radius:15px}.footer{color:#80868b;font-size:12px;margin-top:32px}.bar{height:7px;background:#e8eaed;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:var(--blue)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:relative;height:auto;min-height:0;display:flex;overflow:auto;padding:6px}.navtitle,.sidefoot{display:none}.nav{white-space:nowrap}.main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}.metricgrid{grid-template-columns:repeat(2,1fr)}.brand{min-width:0}.search{display:none}}@media(max-width:560px){.grid,.grid2{grid-template-columns:1fr}.topright span{display:none}.main{padding:16px 10px}.heading h1{font-size:22px}}
</style></head><body>
<header class="top"><div class="brand"><span class="gmark"></span><span>Google Ads Simulator Pro</span></div><div class="search">⌕ &nbsp; Search campaigns, settings and help</div><div class="topright"><span>◈ Appearance</span><span>ⓘ Help</span><span>♧ Notifications</span><div class="avatar">A</div></div></header>
<div class="layout"><aside><div class="navtitle">WORKSPACE</div><div class="nav active" data-page="campaigns"><span class="ico">▦</span> Campaigns</div><div class="nav" data-page="recommendations"><span class="ico">✧</span> Recommendations</div><div class="nav" data-page="reports"><span class="ico">▥</span> Reports</div><div class="nav" data-page="tools"><span class="ico">⚙</span> Tools & settings</div><div class="nav" data-page="billing"><span class="ico">▤</span> Billing</div><div class="sidefoot">◉ &nbsp; Simulator mode · Changes saved locally</div></aside>
<main class="main" id="app"></main></div>
<script>
const $=s=>document.querySelector(s);const app=$('#app');let page='campaigns',step=0;let draft={name:'',goal:'Leads',type:'Search',destination:'Website',website:'',business:'',phone:'',appUrl:'',bid:'Maximise conversions',targetCpa:'',targetRoas:'',budgetType:'daily',budget:'500',location:'India',language:['English','Hindi'],networks:['Google Search'],start:'',end:'',schedule:'All day',devices:['Mobile','Desktop','Tablet'],keywords:'',negative:'',audiences:'',campaignName:'',headlines:['','',''],descriptions:['',''],finalUrl:'',displayPath:'',call:'',sitelinks:'',callouts:'',assetName:'Asset Group 1',brand:'',searchThemes:'',images:'',longHeadline:'',cta:'Automated',eu:'No',notes:''};let campaigns=JSON.parse(localStorage.getItem('simCampaigns')||'[]');if(!campaigns.length){campaigns=[{id:1,name:'Gift Kingdom — Search',type:'Search',goal:'Local shop visits',status:'Enabled',budget:500,impressions:12450,clicks:684,ctr:'5.49%',cpc:8.42,conversions:73,cost:5760},{id:2,name:'Kota Bike Rentals — Performance Max',type:'Performance Max',goal:'Leads',status:'Enabled',budget:700,impressions:18320,clicks:921,ctr:'5.03%',cpc:6.15,conversions:96,cost:5664},{id:3,name:'Quantum Classes — Search',type:'Search',goal:'Website traffic',status:'Paused',budget:350,impressions:8420,clicks:312,ctr:'3.71%',cpc:11.2,conversions:24,cost:3494}];save()}
function save(){localStorage.setItem('simCampaigns',JSON.stringify(campaigns))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setPage(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setPage(n.dataset.page));
const types=[['Search','⌕','Drive action on Google Search with text ads'],['Performance Max','✦','Reach customers across Google channels with one campaign'],['Demand Gen','▶','Drive demand on YouTube, Discover and Gmail'],['Display','▣','Reach potential customers across websites and apps'],['Shopping','🛍','Promote products from Merchant Center'],['Video','▶','Drive action on YouTube with video ads'],['App','▧','Promote your Android or iOS app']];const goals=[['Sales','Drive sales online, in app, by phone or in store'],['Leads','Get leads and other conversions by encouraging customers to take action'],['Website traffic','Get the right people to visit your website'],['App promotion','Get more installs, engagement and pre-registration'],['Awareness and reach','Build awareness and consideration of your product or brand'],['Local shop visits and promotions','Drive visits to local shops'],['Create a campaign without guidance',"You'll choose a campaign next"]];
function field(label,key,placeholder='',type='text',extra=''){return `<div class="field"><label>${label}</label><input type="${type}" data-key="${key}" value="${esc(draft[key])}" placeholder="${placeholder}" ${extra}></div>`}function select(label,key,opts){return `<div class="field"><label>${label}</label><select data-key="${key}">${opts.map(o=>`<option ${draft[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`}function area(label,key,placeholder=''){return `<div class="field"><label>${label}</label><textarea data-key="${key}" placeholder="${placeholder}">${esc(draft[key])}</textarea></div>`}function bind(){document.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('input',()=>{draft[el.dataset.key]=el.value}));document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{let k=el.dataset.check,v=el.value;if(!Array.isArray(draft[k]))draft[k]=[];draft[k]=el.checked?[...draft[k],v]:draft[k].filter(x=>x!==v)})}function multi(label,key,opts){return `<label>${label}</label><div class="chips">${opts.map(o=>`<label class="chip"><input style="width:auto" type="checkbox" data-check="${key}" value="${o}" ${draft[key].includes(o)?'checked':''}> ${o}</label>`).join('')}</div>`}
function head(title,sub=''){return `<div class="crumb">All campaigns　›　${title}</div><div class="heading"><div><h1>${title}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div></div>`}
function render(){if(page==='campaigns')dashboard();else if(page==='create')wizard();else if(page==='recommendations')app.innerHTML=head('Recommendations')+`<div class="card"><div class="cardbody"><h3>Improve your campaign performance</h3><p class="muted">Recommendations are simulated for this offline demo.</p><div class="alert">✓ Add more headlines and images to improve ad strength.</div><div class="alert">✓ Review location targeting and conversion goals.</div></div></div>`;else if(page==='reports')app.innerHTML=head('Reports')+`<div class="card"><div class="cardbody"><h3>Campaign performance report</h3><p>Use the Campaigns page to review sample impressions, clicks, CTR, CPC and conversions.</p></div></div>`;else app.innerHTML=head(page==='tools'?'Tools & settings':'Billing')+`<div class="card"><div class="cardbody"><h3>${page==='tools'?'Planning, measurement and account tools':'Billing summary'}</h3><p class="muted">This simulator does not connect to Google Ads or charge any money.</p></div></div>`}
function dashboard(){let spend=campaigns.reduce((a,c)=>a+c.cost,0),clicks=campaigns.reduce((a,c)=>a+c.clicks,0),imps=campaigns.reduce((a,c)=>a+c.impressions,0),conv=campaigns.reduce((a,c)=>a+c.conversions,0);app.innerHTML=head('Campaigns','Review performance and manage your simulated campaigns.')+`<div class="heading"><div class="muted">Account overview · Last 30 days</div><button class="btn primary" onclick="startCreate()">＋ New campaign</button></div><div class="metricgrid"><div class="metric"><small>Impressions</small><strong>${imps.toLocaleString('en-IN')}</strong><small>Across all campaigns</small></div><div class="metric"><small>Clicks</small><strong>${clicks.toLocaleString('en-IN')}</strong><small>All networks</small></div><div class="metric"><small>Avg. CPC</small><strong>₹${(spend/Math.max(clicks,1)).toFixed(2)}</strong><small>Cost per click</small></div><div class="metric"><small>Conversions</small><strong>${conv}</strong><small>Tracked actions</small></div></div><div class="card"><div class="cardhead">Campaign performance</div><div class="cardbody row"><div><b>Cost</b><div style="font-size:24px;margin-top:5px">₹${spend.toLocaleString('en-IN')}</div></div><div><b>CTR</b><div style="font-size:24px;margin-top:5px">${(clicks/Math.max(imps,1)*100).toFixed(2)}%</div></div><div><b>Campaigns</b><div style="font-size:24px;margin-top:5px">${campaigns.length}</div></div></div></div><div class="heading"><h1 style="font-size:19px">Your campaigns</h1><button class="btn" onclick="startCreate()">＋ Create campaign</button></div><div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Type</th><th>Status</th><th>Budget/day</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Avg. CPC</th><th>Conversions</th><th>Cost</th><th>Actions</th></tr></thead><tbody>${campaigns.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.goal)}</div></td><td>${esc(c.type)}</td><td><span class="status ${c.status==='Paused'?'paused':''}">● ${c.status}</span></td><td>₹${c.budget}</td><td>${c.impressions.toLocaleString('en-IN')}</td><td>${c.clicks}</td><td>${c.ctr}</td><td>₹${Number(c.cpc).toFixed(2)}</td><td>${c.conversions}</td><td>₹${c.cost.toLocaleString('en-IN')}</td><td><button class="btn" onclick="toggleCampaign(${c.id})">${c.status==='Paused'?'Enable':'Pause'}</button> <button class="btn" onclick="editCampaign(${c.id})">Edit</button> <button class="btn" onclick="deleteCampaign(${c.id})">Delete</button></td></tr>`).join('')}</tbody></table></div><div class="footer">This is an independent campaign simulator for learning. It is not affiliated with Google and does not publish real ads.</div>`}
function startCreate(){draft={...draft,name:'',campaignName:'',budget:'500',type:'Search',goal:'Leads',destination:'Website'};step=0;setPage('create')}
window.toggleCampaign=id=>{let c=campaigns.find(x=>x.id===id);c.status=c.status==='Paused'?'Enabled':'Paused';save();dashboard()};window.deleteCampaign=id=>{if(confirm('Delete this simulated campaign?')){campaigns=campaigns.filter(x=>x.id!==id);save();dashboard()}};window.editCampaign=id=>{let c=campaigns.find(x=>x.id===id);draft={...draft,campaignName:c.name,type:c.type,goal:c.goal,budget:String(c.budget)};step=0;page='create';wizard()};
function wizard(){const labels=['Objective & type','Bidding','Campaign settings','Ad group / assets','Budget','Review'];let body='';if(step===0){body=`<div class="card"><div class="cardhead">What's your campaign objective?</div><div class="cardbody"><div class="grid">${goals.map(([n,d])=>`<div class="tile ${draft.goal===n?'selected':''}" onclick="choose('goal','${n}')"><span class="symbol">${n==='Sales'?'◇':n==='Leads'?'♧':n==='Website traffic'?'↗':'◎'}</span><b>${n}</b><p>${d}</p></div>`).join('')}</div></div></div><div class="card"><div class="cardhead">Select a campaign type</div><div class="cardbody"><div class="grid">${types.map(([n,i,d])=>`<div class="tile ${draft.type===n?'selected':''}" onclick="choose('type','${n}')"><span class="symbol">${i}</span><b>${n}</b><p>${d}</p></div>`).join('')}</div><label>Campaign name</label><input data-key="campaignName" value="${esc(draft.campaignName)}" placeholder="e.g. Kota Leads — Search"></div></div><div class="card"><div class="cardhead">Where should people go after clicking your ad?</div><div class="cardbody"><div class="grid2">${['Website','Google Business Profile','Phone Calls','App'].map(x=>`<div class="tile ${draft.destination===x?'selected':''}" onclick="choose('destination','${x}')"><b>${x}</b><p>${x==='Website'?'Send customers to a landing page':x==='Google Business Profile'?'Promote your local business profile':x==='Phone Calls'?'Encourage customers to call':'Drive app installs and engagement'}</p></div>`).join('')}</div>${draft.destination==='Website'?field('Final website URL','website','https://example.com'):draft.destination==='Google Business Profile'?field('Business Profile name or Maps link','business','Business name / profile URL'):draft.destination==='Phone Calls'?field('Phone number','phone','e.g. +91 98765 43210','tel'):field('App store URL','appUrl','Google Play / App Store URL')}</div></div>`}
if(step===1){body=`<div class="card"><div class="cardhead">Bidding</div><div class="cardbody"><p>What do you want to focus on?</p>${select('Bidding strategy','bid',['Maximise conversions','Maximise conversion value','Maximise clicks','Target CPA','Target ROAS','Target impression share','Manual CPC'])}${['Target CPA'].includes(draft.bid)?field('Target cost per action (₹)','targetCpa','e.g. 150','number'):''}${draft.bid==='Target ROAS'?field('Target return on ad spend (%)','targetRoas','e.g. 400','number'):''}<div class="alert">Smart Bidding strategies use automated bidding to optimise for your selected goal. Options shown depend on campaign type and goal.</div></div></div><div class="card"><div class="cardhead">Customer acquisition</div><div class="cardbody"><label class="radio"><input type="checkbox" id="newcustomers"> Bid higher for new customers</label><label class="radio"><input type="checkbox" id="retention"> Adjust bidding to re-engage existing customers</label></div></div>`}
if(step===2){body=`<div class="card"><div class="cardhead">Campaign settings</div><div class="cardbody">${field('Locations','location','Country, state, city or radius')}${multi('Languages','language',['English','Hindi','Spanish','French'])}<hr><h3>Networks</h3>${multi('Where ads can appear','networks',['Google Search','Search partners','Google Display Network','YouTube','Discover','Gmail'])}<hr><h3>Devices</h3>${multi('Devices','devices',['Mobile','Desktop','Tablet'])}<div class="grid2">${field('Start date','start','','date')}${field('End date (optional)','end','','date')}</div>${select('Ad schedule','schedule',['All day','Business hours (9 AM–6 PM)','Weekdays','Custom schedule'])}<label>EU political ads</label><label class="radio"><input type="radio" name="eu" value="No" ${draft.eu==='No'?'checked':''} onchange="draft.eu='No'"> No, this campaign doesn't have EU political ads</label><label class="radio"><input type="radio" name="eu" value="Yes" ${draft.eu==='Yes'?'checked':''} onchange="draft.eu='Yes'"> Yes, this campaign has EU political ads</label></div></div>`}
if(step===3){body=`<div class="card"><div class="cardhead">${draft.type==='Performance Max'?'Asset group':'Ad group'} setup</div><div class="cardbody">${field('Name','assetName','Ad group 1')}${field('Brand / business name','brand','Your business name')}${draft.type==='Search'?`${area('Keywords (one per line)','keywords','best coaching in kota\ncoaching classes near me\n[best coaching kota]')}${area('Negative keywords (one per line)','negative','free\njobs')}`:`${area('Search themes (up to 50)','searchThemes','gift shop kota\nbirthday gifts kota')}${field('Long headline','longHeadline','A longer headline for your business')}${field('Image asset notes','images','Describe or list image assets')}`}<hr><h3>Ad assets</h3>${field('Final URL','finalUrl',draft.website||'https://example.com')}${field('Display path','displayPath','offers / kota')}${field('Headline 1','h1','Your main headline')}${field('Headline 2','h2','A second headline')}${field('Headline 3','h3','A third headline')}${area('Description 1','d1','Describe your product or service')}${area('Description 2','d2','Add another reason to choose you')}${field('Call asset / phone','call','+91 98765 43210','tel')}${area('Sitelinks (one per line)','sitelinks','About us\nContact\nOffers')}${area('Callouts (one per line)','callouts','Free consultation\nTrusted service')}${select('Call to action','cta',['Automated','Learn more','Call now','Shop now','Sign up','Get quote','Book now'])}</div></div><div class="card"><div class="cardhead">Ad preview</div><div class="cardbody"><div class="preview"><div class="url">${esc(draft.finalUrl||draft.website||'www.example.com')}</div><h3>${esc(draft.h1||'Your ad headline will appear here')}</h3><p>${esc(draft.d1||'Your ad description will appear here. Add relevant details about your business.')}</p><span class="tag">Sponsored</span></div></div></div>`}
if(step===4){body=`<div class="card"><div class="cardhead">Budget</div><div class="cardbody"><div class="alert">Your selected budget is a simulation only. No money will be charged and no ads will run.</div><label class="radio"><input type="radio" name="budgetType" value="daily" ${draft.budgetType==='daily'?'checked':''} onchange="draft.budgetType='daily';wizard()"> Average daily budget</label><label class="radio"><input type="radio" name="budgetType" value="total" ${draft.budgetType==='total'?'checked':''} onchange="draft.budgetType='total';wizard()"> Campaign total budget</label>${field(draft.budgetType==='daily'?'Average daily budget (₹)':'Campaign total budget (₹)','budget','500','number')}<p class="hint">${draft.budgetType==='daily'?'Monthly planning estimate: ₹'+(Number(draft.budget||0)*30).toLocaleString('en-IN')+' (daily budget × 30 days).':'Total amount available for the campaign duration.'}</p></div></div><div class="card"><div class="cardhead">Channel prioritisation</div><div class="cardbody">Direct budget to the channels that matter most. In this simulator, channel priority is informational only.${multi('Priority channels','priority',['Google channels','Search partners','Google Display Network'])}</div></div>`}
if(step===5){body=`<div class="card"><div class="cardhead">Review your campaign</div><div class="cardbody"><div class="alert">Check your settings before creating this simulated campaign. You can go back to edit any section.</div>${[['Campaign',draft.campaignName||draft.type],['Objective',draft.goal],['Campaign type',draft.type],['Destination',draft.destination],['Bidding',draft.bid],['Budget',`₹${draft.budget} ${draft.budgetType==='daily'?'per day':'total'}`],['Location',draft.location],['Languages',(draft.language||[]).join(', ')],['Networks',(draft.networks||[]).join(', ')],['Keywords',draft.keywords||draft.searchThemes||'Not provided'],['Final URL',draft.finalUrl||draft.website||draft.business||draft.phone||draft.appUrl||'Not provided'],['EU political ads',draft.eu]].map(([k,v])=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #eee"><b>${k}</b><span>${esc(v)}</span></div>`).join('')}<div class="alert">Campaign status after creation: Paused. You can enable it from the campaign table.</div></div></div>`}
app.innerHTML=head('New campaign','Create a campaign · Simulator mode')+`<div class="stepper">${labels.map((l,i)=>`<div class="step ${i===step?'active':i<step?'done':''}" onclick="goStep(${i})">${i+1}. ${l}</div>`).join('')}</div>${body}<div class="actions"><button class="btn" onclick="${step===0?'setPage(\'campaigns\')':'goStep(step-1)'}">${step===0?'Cancel':'Back'}</button><button class="btn primary" onclick="${step===5?'publish()':'nextStep()'}">${step===5?'Create campaign':'Next'}</button></div><div class="footer">© Google Ads Simulator Pro · Not an official Google product</div>`;bind()}
window.choose=(k,v)=>{draft[k]=v;wizard()};window.goStep=n=>{step=n;wizard()};window.nextStep=()=>{if(step===0&&!draft.campaignName)draft.campaignName=(draft.name||'New')+' — '+draft.type;if(step===0&&draft.destination==='Website'&&!draft.website){alert('Please enter your website URL.');return}if(step===0&&draft.destination==='Phone Calls'&&!draft.phone){alert('Please enter a phone number.');return}if(step===3&&(!draft.h1||!draft.d1)&&draft.type==='Search'){if(!confirm('Some ad assets are empty. Continue anyway?'))return}if(step===4&&(!Number(draft.budget)||Number(draft.budget)<=0)){alert('Enter a valid budget greater than zero.');return}step=Math.min(5,step+1);wizard()};window.publish=()=>{let budget=Math.max(1,Number(draft.budget)||500),c={id:Date.now(),name:draft.campaignName||'New campaign',type:draft.type,goal:draft.goal,status:'Paused',budget,impressions:0,clicks:0,ctr:'0.00%',cpc:0,conversions:0,cost:0};campaigns.unshift(c);save();page='campaigns';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='campaigns'));dashboard();alert('Your simulated campaign has been created and saved as Paused. No real ads have been published.')};render();
